<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Payless Motors - Tech Upload</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f131c; color: #dfe2ee; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
  <div class="w-full max-w-sm bg-[#1c2028] rounded-xl p-6 shadow-xl text-center border border-[#3c4a42]">
    <div class="w-12 h-12 rounded bg-[#31353e] flex items-center justify-center text-[#4edea3] font-bold text-xl mx-auto mb-4">
      PMG
    </div>
    <h1 class="text-xl font-semibold mb-2">Technician Portal</h1>
    <p class="text-sm text-[#bbcabf] mb-8">Tap the button below to open your camera and scan a receipt.</p>

    <!-- Camera Upload Button using HTML5 capture -->
    <label class="w-full flex flex-col items-center justify-center py-4 bg-[#10b981] hover:bg-[#059669] text-[#003824] rounded-lg font-bold text-lg cursor-pointer transition-colors shadow-lg active:scale-95">
      <svg class="w-8 h-8 mb-2 text-[#003824]" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
      </svg>
      Upload Image or PDF
      <input type="file" id="cameraInput" accept="image/*,application/pdf" class="hidden">
    </label>

    <div id="statusIndicator" class="mt-6 text-sm hidden">
      <p class="text-[#ffb95f] animate-pulse">Uploading and Parsing...</p>
    </div>
    
    <div id="successIndicator" class="mt-6 text-sm hidden">
      <p class="text-[#4edea3]">✅ Receipt successfully uploaded!</p>
      <button onclick="reset()" class="mt-3 text-[#7bd0ff] underline">Scan another</button>
    </div>
  </div>

  <script>
    const cameraInput = document.getElementById('cameraInput');
    const statusIndicator = document.getElementById('statusIndicator');
    const successIndicator = document.getElementById('successIndicator');

    cameraInput.addEventListener('change', async (e) => {
      if (e.target.files.length === 0) return;
      const file = e.target.files[0];

      // Convert to Base64
      const reader = new FileReader();
      reader.onload = async (event) => {
        const base64Data = event.target.result.split(',')[1];
        
        statusIndicator.classList.remove('hidden');
        successIndicator.classList.add('hidden');
        cameraInput.parentElement.classList.add('opacity-50', 'pointer-events-none');

        try {
          // Point to production API Gateway
          const response = await fetch('https://mxsz3a6pr3.execute-api.ca-central-1.amazonaws.com/Prod/extract', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ imageData: base64Data })
          });

          if (response.ok) {
            statusIndicator.classList.add('hidden');
            successIndicator.classList.remove('hidden');
          } else {
            alert('Upload failed. Please try again.');
            reset();
          }
        } catch (err) {
          console.error(err);
          alert('Network error.');
          reset();
        }
      };
      reader.readAsDataURL(file);
    });

    function reset() {
      cameraInput.value = '';
      statusIndicator.classList.add('hidden');
      successIndicator.classList.add('hidden');
      cameraInput.parentElement.classList.remove('opacity-50', 'pointer-events-none');
    }
  </script>
<script src="auth.js"></script>
</body>
</html>
